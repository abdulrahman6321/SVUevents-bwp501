<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفعاليات - SVU Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{font-family:'Segoe UI',sans-serif;background:#f8f9fa;}
        .card{transition:transform 0.3s;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
        .card:hover{transform:translateY(-5px);}
        .dark-mode{background:#1a1a1a;color:white;}
        .dark-mode .card{background:#2d2d2d;color:white;}
        .scroll-top{position:fixed;bottom:20px;right:20px;background:#0d6efd;border:none;border-radius:50%;width:50px;height:50px;color:white;display:none;z-index:1000;}
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <img src="https://via.placeholder.com/40/0D6EFD/FFFFFF?text=SVU" width="35" class="me-2 rounded-circle">
            SVU Events
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">الرئيسية</a>
            <a class="nav-link active" href="events.html">الفعاليات</a>
            <a class="nav-link" href="about.html">من نحن</a>
            <a class="nav-link" href="contact.html">اتصل بنا</a>
            <a class="nav-link btn btn-outline-light ms-2" href="admin.html">تسجيل الدخول</a>
        </div>
    </div>
</nav>

<!-- Search & Filter -->
<div class="container my-5">
    <h1 class="text-center mb-5">جميع الفعاليات</h1>
    <div class="row g-3 mb-5">
        <div class="col-lg-3 col-md-6">
            <input type="text" class="form-control" id="search" placeholder="🔍 ابحث بالعنوان">
        </div>
        <div class="col-lg-3 col-md-6">
            <select class="form-select" id="category">
                <option value="">جميع التصنيفات</option>
                <option value="رياضة">رياضة</option>
                <option value="ثقافة">ثقافة</option>
                <option value="علمي">علمي</option>
                <option value="اجتماعي">اجتماعي</option>
            </select>
        </div>
        <div class="col-lg-3 col-md-6">
            <input type="date" class="form-control" id="dateFilter">
        </div>
        <div class="col-lg-3 col-md-6">
            <button class="btn btn-primary w-100" onclick="filterEvents()">
                <i class="bi bi-funnel"></i> فلترة
            </button>
        </div>
    </div>
</div>

<!-- Events Grid -->
<div class="container">
    <div class="row g-4" id="eventsContainer">
        <!-- Event 1 -->
        <div class="col-lg-4 col-md-6 event-item" data-title="مهرجان" data-category="رياضة" data-date="2026-05-15">
            <div class="card h-100">
                <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=400&h=250&fit=crop" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">مهرجان الرياضة السنوي</h5>
                    <p class="card-text text-muted">
                        <i class="bi bi-calendar3 me-1"></i>15/05/2026<br>
                        <i class="bi bi-geo-alt me-1"></i>الملعب الرئيسي
                    </p>
                    <span class="badge bg-primary mb-2">رياضة</span>
                    <button class="btn btn-primary w-100" onclick="showEvent(1)">
                        <i class="bi bi-eye me-1"></i>عرض التفاصيل
                    </button>
                </div>
            </div>
        </div>

        <!-- Event 2 -->
        <div class="col-lg-4 col-md-6 event-item" data-title="معرض" data-category="ثقافة" data-date="2026-05-20">
            <div class="card h-100">
                <img src="https://images.unsplash.com/photo-1579952363873-27d3bfad9c6b?w=400&h=250&fit=crop" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">المعرض الثقافي السنوي</h5>
                    <p class="card-text text-muted">
                        <i class="bi bi-calendar3 me-1"></i>20/05/2026<br>
                        <i class="bi bi-geo-alt me-1"></i>قاعة الفنون
                    </p>
                    <span class="badge bg-success mb-2">ثقافة</span>
                    <button class="btn btn-primary w-100" onclick="showEvent(2)">
                        <i class="bi bi-eye me-1"></i>عرض التفاصيل
                    </button>
                </div>
            </div>
        </div>

        <!-- Event 3 -->
        <div class="col-lg-4 col-md-6 event-item" data-title="ندوة" data-category="علمي" data-date="2026-05-25">
            <div class="card h-100">
                <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=400&h=250&fit=crop" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">ندوة الذكاء الاصطناعي</h5>
                    <p class="card-text text-muted">
                        <i class="bi bi-calendar3 me-1"></i>25/05/2026<br>
                        <i class="bi bi-geo-alt me-1"></i>القاعة الكبرى
                    </p>
                    <span class="badge bg-info mb-2">علمي</span>
                    <button class="btn btn-primary w-100" onclick="showEvent(3)">
                        <i class="bi bi-eye me-1"></i>عرض التفاصيل
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Event Modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- سيتم ملؤه بالـ JavaScript -->
            </div>
            <div class="modal-footer">
                <a href="#" class="btn btn-success" id="addCalendar">
                    <i class="bi bi-calendar-plus"></i> إضافة للتقويم
                </a>
                <a href="#" class="btn btn-info" id="shareEvent">
                    <i class="bi bi-share"></i> مشاركة
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Controls -->
<button class="scroll-top" onclick="window.scrollTo(0,0)" title="أعلى الصفحة">⬆️</button>
<button class="scroll-top" onclick="toggleDark()" title="الوضع الليلي">🌙</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const eventsData = {
    1: {
        title: "مهرجان الرياضة السنوي",
        date: "15 مايو 2026",
        time: "9:00 ص - 6:00 م", 
        location: "الملعب الرئيسي",
        category: "رياضة",
        desc: "فعالية رياضية كبرى تشمل كرة القدم، السلة، التنس، والمصارعة. مناسبة للطلاب والموظفين.",
        img: "https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600&h=400&fit=crop",
        map: "https://maps.google.com"
    },
    2: {
        title: "المعرض الثقافي السنوي", 
        date: "20 مايو 2026",
        time: "10:00 ص - 8:00 م",
        location: "قاعة الفنون",
        category: "ثقافة",
        desc: "معرض للفنون التشكيلية والثقافة يضم أعمال الطلاب والفنانين المحليين.",
        img: "https://images.unsplash.com/photo-1579952363873-27d3bfad9c6b?w=600&h=400&fit=crop",
        map: "https://maps.google.com"
    },
    3: {
        title: "ندوة الذكاء الاصطناعي",
        date: "25 مايو 2026",
        time: "2:00 م - 5:00 م",
        location: "القاعة الكبرى",
        category: "علمي", 
        desc: "ندوة حول تطبيقات الذكاء الاصطناعي في التعليم والأعمال.",
        img: "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=600&h=400&fit=crop",
        map: "https://maps.google.com"
    }
};

function showEvent(id) {
    const event = eventsData[id];
    document.getElementById('modalTitle').textContent = event.title;
    document.getElementById('modalBody').innerHTML = `
        <div class="row">
            <div class="col-md-5">
                <img src="${event.img}" class="img-fluid rounded shadow">
            </div>
            <div class="col-md-7">
                <div class="mb-3">
                    <span class="badge fs-6 bg-${event.category === 'رياضة' ? 'primary' : event.category === 'ثقافة' ? 'success' : 'info'}">${event.category}</span>
                </div>
                <h6><i class="bi bi-calendar3 text-primary me-2"></i>${event.date}</h6>
                <h6><i class="bi bi-clock text-warning me-2"></i>${event.time}</h6>
                <h6><i class="bi bi-geo-alt text-success me-2"></i>${event.location}</h6>
                <hr>
                <p class="lead">${event.desc}</p>
                <a href="${event.map}" target="_blank" class="btn btn-outline-primary">
                    <i class="bi bi-geo-alt me-1"></i>الطريق على الخريطة
                </a>
            </div>
        </div>
    `;
    document.getElementById('addCalendar').onclick = () => alert('تمت إضافة الفعالية للتقويم!');
    document.getElementById('shareEvent').onclick = () => navigator.share?.({title: event.title, url: window.location.href}) || alert('تم نسخ الرابط!');
    
    new bootstrap.Modal(document.getElementById('eventModal')).show();
}

function filterEvents() {
    const search = document.getElementById('search').value.toLowerCase();
    const category = document.getElementById('category').value;
    const date = document.getElementById('dateFilter').value;
    
    document.querySelectorAll('.event-item').forEach(item => {
        const title = item.dataset.title.toLowerCase();
        const cat = item.dataset.category;
        const itemDate = item.dataset.date;
        
        let show = true;
        if(search && !title.includes(search)) show = false;
        if(category && category !== cat) show = false;
        if(date && date !== itemDate) show = false;
        
        item.style.display = show ? '' : 'none';
    });
}

function toggleDark() {
    document.body.classList.toggle('dark-mode');
}

window.onscroll = () => {
    document.querySelectorAll('.scroll-top').forEach(btn => {
        btn.style.display = window.scrollY > 300 ? 'block' : 'none';
    });
};
</script>
</body>
</html>
